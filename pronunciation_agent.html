<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 발음 코치 · Azure 음소 평가</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Azure Speech SDK -->
<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#20242e; --ink:#ece7da;
    --muted:#888f9c; --accent:#ffb454; --accent2:#5ee0c0;
    --bad:#ff6b6b; --warn:#ffd166; --good:#5ee0c0; --line:#2b313c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(255,180,84,.08), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(94,224,192,.07), transparent 60%),
      var(--bg);
    color:var(--ink); font-family:"Noto Sans KR",sans-serif;
    min-height:100vh; padding:30px 16px 60px; display:flex; justify-content:center;
  }
  .wrap{width:100%;max-width:680px}
  .kicker{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
  h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(32px,7vw,48px);line-height:1.04;margin:6px 0 4px;letter-spacing:-1px}
  h1 em{font-style:italic;color:var(--accent2);font-weight:500}
  .sub{color:var(--muted);font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}
  .label{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .target{font-family:"Fraunces",serif;font-size:clamp(20px,4.5vw,28px);line-height:1.4;font-weight:600}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  button{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:13px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  button:hover{border-color:var(--accent);transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-rec{background:var(--accent);color:#1a1205;border-color:var(--accent)}
  .btn-rec.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,107,107,.18)}}
  input[type=text],input[type=password]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 13px;font-size:14px;font-family:"Space Mono",monospace}
  .setup{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:14px}
  .setup summary{cursor:pointer;font-weight:700;color:var(--accent2)}
  .setup .field{margin-top:10px}
  .setup .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .result{margin-top:18px;display:none}
  .result.show{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ring-row{display:flex;align-items:center;gap:18px;margin-bottom:14px;flex-wrap:wrap}
  .ring{width:96px;height:96px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-weight:900;font-size:30px;background:conic-gradient(var(--accent2) var(--deg,0deg),var(--line) 0)}
  .ring span{width:78px;height:78px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center}
  .subscores{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;flex:1;min-width:220px}
  .ss{font-size:13px}
  .ss b{font-family:"Space Mono",monospace;float:right}
  .bar{height:6px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent2);border-radius:4px}
  .words{font-family:"Fraunces",serif;font-size:22px;line-height:1.7;margin-top:16px}
  .words .w{padding:1px 4px;border-radius:5px;cursor:default;position:relative}
  .words .w.good{color:var(--good)}
  .words .w.mid{color:var(--warn)}
  .words .w.low{color:var(--bad);text-decoration:underline wavy var(--bad)}
  .words .w[data-ph]:hover::after{content:attr(data-ph);position:absolute;left:0;bottom:130%;background:#000;color:#fff;font-family:"Space Mono",monospace;font-size:11px;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:5;border:1px solid var(--line)}
  .feedback{margin-top:14px;padding:14px 16px;border-left:3px solid var(--accent);background:rgba(255,180,84,.06);border-radius:0 10px 10px 0;font-size:14px;line-height:1.65}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  .nav .count{font-family:"Space Mono",monospace;font-size:13px;color:var(--muted)}
  .status{margin-top:12px;font-size:13px;color:var(--muted);min-height:20px}
  .warn{margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.6;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
  .warn b{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Daily English · Pronunciation Agent</div>
    <h1>오늘의 발음 <em>코치</em></h1>
    <div class="sub">문장 듣기 → 따라 말하기 → Azure 음소 평가 + 한국어 피드백</div>
  </header>

  <details class="setup">
    <summary>⚙️ 처음 한 번만: Azure 키 입력</summary>
    <div class="field">
      <label>Azure Speech 키 (KEY 1)</label>
      <input type="password" id="azKey" placeholder="여기에 붙여넣기">
    </div>
    <div class="field">
      <label>지역 (Region) — 예: koreacentral</label>
      <input type="text" id="azRegion" placeholder="koreacentral" value="koreacentral">
    </div>
    <div class="field">
      <button id="saveKey">키 저장</button>
      <span id="keyState" style="font-size:12px;color:var(--muted);margin-left:8px"></span>
    </div>
  </details>

  <div class="card">
    <div class="label">오늘의 문장</div>
    <div class="target" id="target"></div>

    <div class="row">
      <button id="listen">🔊 원어민 발음 듣기</button>
      <button id="record" class="btn-rec">🎤 녹음 시작</button>
    </div>
    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div class="ring-row">
        <div class="ring" id="ring"><span id="scoreNum">0</span></div>
        <div class="subscores">
          <div class="ss">정확도 <b id="s-acc">0</b><div class="bar"><i id="b-acc"></i></div></div>
          <div class="ss">유창성 <b id="s-flu">0</b><div class="bar"><i id="b-flu"></i></div></div>
          <div class="ss">완성도 <b id="s-comp">0</b><div class="bar"><i id="b-comp"></i></div></div>
          <div class="ss">운율 <b id="s-pros">0</b><div class="bar"><i id="b-pros"></i></div></div>
        </div>
      </div>
      <div class="words" id="words"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="nav">
      <button id="prev">← 이전</button>
      <div class="count" id="count"></div>
      <button id="next">다음 →</button>
    </div>
  </div>

  <div class="warn">
    <b>실행 안내:</b> 이 파일은 <b>Chrome 또는 Edge</b>에서 열어야 마이크가 동작합니다. 더블클릭해서 열고,
    처음 녹음할 때 <b>마이크 권한 허용</b>을 눌러주세요. Azure 키는 이 브라우저에만 저장되며 외부로 전송되지 않습니다.
  </div>
</div>

<script>
/* ============ 학습 문장 (자동화가 매일 이 부분을 교체) ============ */
const SENTENCES = [
  "The weather today is sunny and warm.",
  "Many people enjoy reading the news every morning.",
  "Technology is changing the way we communicate.",
  "She quickly finished her homework before dinner.",
  "We should protect the environment for future generations."
];

const $ = id => document.getElementById(id);
let idx = 0;

/* ---- 키 저장/불러오기 (브라우저 로컬) ---- */
function loadKey(){
  const k = localStorage.getItem("az_key") || "";
  const r = localStorage.getItem("az_region") || "koreacentral";
  $("azKey").value = k; $("azRegion").value = r;
  $("keyState").textContent = k ? "✓ 저장됨" : "미설정";
}
$("saveKey").onclick = () => {
  localStorage.setItem("az_key", $("azKey").value.trim());
  localStorage.setItem("az_region", $("azRegion").value.trim());
  $("keyState").textContent = "✓ 저장됨";
  $("status").textContent = "키가 저장되었습니다. 이제 녹음할 수 있어요.";
};

/* ---- 문장 표시 ---- */
function renderTarget(){
  $("target").textContent = SENTENCES[idx];
  $("count").textContent = `${idx+1} / ${SENTENCES.length}`;
  $("result").classList.remove("show");
  $("status").textContent = "";
  $("prev").disabled = idx===0;
  $("next").disabled = idx===SENTENCES.length-1;
}

/* ---- TTS 원어민 발음 ---- */
$("listen").onclick = () => {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(SENTENCES[idx]);
  u.lang = "en-US"; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(x=>/en-US/i.test(x.lang));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
};

/* ---- 한국어 피드백 생성 ---- */
function makeFeedback(score, lowWords){
  let head;
  if(score>=90) head="🏆 훌륭해요! 원어민에 가까운 발음이에요.";
  else if(score>=75) head="👍 잘했어요! 조금만 더 다듬으면 완벽합니다.";
  else if(score>=60) head="💪 좋아요. 아래 표시된 단어를 천천히 다시 연습해보세요.";
  else head="🌱 괜찮아요. 먼저 '원어민 발음 듣기'로 들은 뒤 또박또박 따라해보세요.";
  let detail="";
  if(lowWords.length){
    detail = `<br><br>특히 신경 쓸 단어: <b style="color:var(--accent)">${lowWords.join(", ")}</b>`
           + `<br>단어 위에 마우스를 올리면 음소별 점수가 보여요. 끝소리(자음)까지 분명히 발음해보세요.`;
  } else if(score>=90){
    detail = "<br><br>모든 단어가 또렷하게 인식됐어요. 다음 문장으로 가도 좋습니다!";
  }
  return head + detail;
}

/* ---- Azure 발음 평가 ---- */
let recognizing = false;
$("record").onclick = () => {
  if(recognizing) return;
  const key = localStorage.getItem("az_key");
  const region = localStorage.getItem("az_region") || "koreacentral";
  if(!key){
    $("status").textContent = "⚠️ 먼저 위의 '⚙️ Azure 키 입력'을 열어 키를 저장해주세요.";
    return;
  }
  if(!window.SpeechSDK){
    $("status").textContent = "⚠️ Azure SDK 로딩 실패. 인터넷 연결을 확인하고 새로고침하세요.";
    return;
  }
  runAssessment(key, region, SENTENCES[idx]);
};

function runAssessment(key, region, refText){
  const SDK = window.SpeechSDK;
  const speechConfig = SDK.SpeechConfig.fromSubscription(key, region);
  speechConfig.speechRecognitionLanguage = "en-US";
  const audioConfig = SDK.AudioConfig.fromDefaultMicrophoneInput();

  const paConfig = new SDK.PronunciationAssessmentConfig(
    refText,
    SDK.PronunciationAssessmentGradingSystem.HundredMark,
    SDK.PronunciationAssessmentGranularity.Phoneme,
    true // miscue 활성화
  );
  paConfig.enableProsodyAssessment = true;

  const recognizer = new SDK.SpeechRecognizer(speechConfig, audioConfig);
  paConfig.applyTo(recognizer);

  recognizing = true;
  $("record").classList.add("live");
  $("record").textContent = "⏹ 듣는 중...";
  $("status").textContent = "🎤 지금 문장을 읽어주세요...";
  $("result").classList.remove("show");

  recognizer.recognizeOnceAsync(result => {
    stopUI();
    if(result.reason === SDK.ResultReason.RecognizedSpeech){
      const pa = SDK.PronunciationAssessmentResult.fromResult(result);
      showResult(pa);
    } else if(result.reason === SDK.ResultReason.NoMatch){
      $("status").textContent = "🔇 음성이 인식되지 않았어요. 마이크에 가까이서 다시 시도해주세요.";
    } else {
      $("status").textContent = "⚠️ 인식 실패: " + result.reason + " (키/지역이 맞는지 확인하세요)";
    }
    recognizer.close();
  }, err => {
    stopUI();
    $("status").textContent = "⚠️ 오류: " + err + " — 키와 지역(region)을 다시 확인해주세요.";
    recognizer.close();
  });
}

function stopUI(){
  recognizing = false;
  $("record").classList.remove("live");
  $("record").textContent = "🎤 녹음 시작";
}

function setBar(scoreId, barId, val){
  $(scoreId).textContent = Math.round(val);
  $(barId).style.width = val + "%";
}

function showResult(pa){
  const overall = pa.pronunciationScore;
  $("scoreNum").textContent = Math.round(overall);
  $("ring").style.setProperty("--deg", (overall*3.6)+"deg");
  setBar("s-acc","b-acc", pa.accuracyScore);
  setBar("s-flu","b-flu", pa.fluencyScore);
  setBar("s-comp","b-comp", pa.completenessScore);
  setBar("s-pros","b-pros", pa.prosodyScore || 0);

  // 단어별 + 음소별
  const detail = pa.detailResult || {};
  const words = detail.Words || [];
  const lowWords = [];
  let html = "";
  words.forEach(w => {
    const acc = (w.PronunciationAssessment && w.PronunciationAssessment.AccuracyScore) ?? 100;
    const errType = w.PronunciationAssessment && w.PronunciationAssessment.ErrorType;
    let cls = acc>=80 ? "good" : acc>=55 ? "mid" : "low";
    if(errType==="Omission" || errType==="Insertion") cls="low";
    if(cls!=="good") lowWords.push(w.Word);
    // 음소 점수 툴팁
    let ph = "";
    if(w.Phonemes && w.Phonemes.length){
      ph = w.Phonemes.map(p =>
        `${p.Phoneme}:${Math.round((p.PronunciationAssessment&&p.PronunciationAssessment.AccuracyScore)||0)}`
      ).join("  ");
    }
    html += `<span class="w ${cls}" data-ph="${ph}">${w.Word}</span> `;
  });
  $("words").innerHTML = html || "(단어 분석 없음)";
  $("feedback").innerHTML = makeFeedback(overall, lowWords);
  $("status").textContent = "";
  $("result").classList.add("show");
}

$("prev").onclick = () => { if(idx>0){idx--;renderTarget();} };
$("next").onclick = () => { if(idx<SENTENCES.length-1){idx++;renderTarget();} };

loadKey();
renderTarget();
</script>
</body>
</html>
